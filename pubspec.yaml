name: kukula_app
description: Easy Poultry Manager — All-in-one poultry farm management app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Charts
  fl_chart: ^0.69.0

  # Localization (must match flutter_localizations)
  intl: ^0.20.3

  # Utilities
  uuid: ^4.4.2
  shared_preferences: ^2.3.2

  # PDF Generation & Sharing (Phase 8)
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
